name: CI

# Every pull request (forks included) and every push to main. The engine tag workflow
# calls this one too, with the tldraw license key. Nothing here creates a GitHub
# Release: the desktop app's updater reads this repo's latest Release.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    secrets:
      TLDRAW_LICENSE_KEY:
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - name: Install Playwright's Chromium
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:browser

      - name: Build the bundle
        run: pnpm build
        env:
          TLDRAW_LICENSE_KEY: ${{ secrets.TLDRAW_LICENSE_KEY }}

      - name: Bundle smoke test
        run: pnpm test:bundle
        env:
          UNFRAMED_BUNDLE_DIR: ${{ github.workspace }}/dist

      - uses: actions/upload-artifact@v4
        with:
          name: engine-bundle
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
